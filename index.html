<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>PPO</title>
 		<link rel="stylesheet" href="css/radar.css">
		<style>
			* { margin: 0; padding: 0;}

			.box{
				width: 200px;
				border: 1px solid white;
				border-radius: 5px;
				position: absolute;
				left: 50px;
				padding: 2px;
				z-index: 10;
				overflow: hidden;

				color:grey;
				background:white;
				opacity: 0.8; 
			}

			#speed_info{		
				//height: 25px;	
				top:50px;	
			}

			#speed_info span{
				width: 67px;
				background: #758b7a;// #68689d;
				display: inline-block;
				height: 25px; 
				color:white;
				text-align: center;
				line-height: 25px;
			}

			#info{
				top: 100px;
				min-height: 150px;
				padding-top: 10px;
				color:grey;
				background:white;
				opacity: 0.6; 
			}

			#info p{
				padding: 0 10px 5px 10px;
			}

			#info label{
				display: inline-block;
				width: 120px;
				//padding-left: 10px;
			}

			#info span{
				display: inline-block;
				width: 50px;
				text-align: right;
			}
		</style>

		<script type="importmap">
		  {
		    "imports": {
		      "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
		      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
		    }
		  }
		</script>
	</head>
	<body>
		<div id="speed_info" class="box">
			<span id="speed_progress">50</span>
		</div>

		<div id="info" class="box">
			<p> <label>angleV</label> 	<span>45</span> </p>	
			<p> <label>angleH</label> 	<span>45</span> </p>
			<p> <label>Hmax</label>   	<span>0</span> </p>
			<p> <label>Lmax</label>   	<span>0</span> </p>
			<p> <label>Tflight</label>  <span>0</span> </p>
			<p> <label>x</label>      	<span>0</span> </p>
			<p> <label>h</label>      	<span>0</span> </p>
			<p> <label>z</label>      	<span>0</span> </p>	
		</div>

		
    	<!--<a href="javascript:;" id="radar-switch-btn"></a>
		<br><br><br>-->
		<div class="radar"></div>
		<script type="text/javascript" src="js/radar.js"></script>

	</body>
</html>

<script type="module" src="js/Main.js">
</script>
