 	class Game{
    	constructor(){
			this.Objects=[]; //
			this.Enemies=[];

			this.Rockets=[];
			this.SmokeParticles=[];

			this.world = new World();

			const sky = new Sky(this.world.scene);
			this.Objects.push(sky);

			const patriot = new Patriot(this.world.scene, new THREE.Vector3(6.5,0,6.5));
			this.Objects.push(patriot);
			this.CurLauncher = patriot;

			const locator = new Locator(this.world.scene, new THREE.Vector3(10,0,-15) );
			this.Objects.push(locator);



			//********************************************************************
			for(let i=0; i<10; i++){
				let angle = 2*Math.PI*Math.random();
				let R = 200 + 200*Math.random();

				let x=  R*Math.cos(angle);
				let z=  R*Math.sin(angle);

				let enemy = new Patriot(this.world.scene, new THREE.Vector3(x,0,z));
				this.Enemies.push(enemy);
			}
			this.CurEnemyLauncher = this.Enemies[0];
			this.CurEnemyIndex = 0;

    	}

    	animate(){
    		//requestAnimationFrame(this.animate);

    		for(let i=0; i<this.Rockets.length; i++){
        		this.Rockets[i].move();

				if (i==this.Rockets.length-1){
					this.Rockets[i].showParam(Spans);
				}

	        	// Вилучення після падіння
	            if (this.Rockets[i].position.y <= 0) {
	                /*if (!showFlightSmoke) {
	                	let sP = Rockets[i].smokeParticles;
	                	for(var j=0; j<sP.length; j++){
	                		scene.remove(sP[j]);
	                	}
	                }*/

	 				this.world.scene.remove(this.Rockets[i].mesh);
	                this.Rockets.splice(i, 1);
	            }
	        }


			for(let j=0; j<this.SmokeParticles.length; j++){
				let SP=this.SmokeParticles[j];
	        	SP.material.opacity-=0.0005;
	        	SP.position.y+=0.005;
	        	SP.position.z+=0.001;

	        	if( SP.material.opacity<0.01 ) {
	        		this.world.scene.remove(SP);
	        		this.SmokeParticles.splice(j,1);
	        	}	 		
	        }

	        for( let i=0; i<this.Objects.length; i++){
	        	this.Objects[i].animate();
	        }
    		

	        let T = 500*Math.random();
	        if(T<10){
	        	let index = Math.round((this.Enemies.length-1)*Math.random());
	        	this.CurEnemyLauncher = this.Enemies[index];


	        	this.CurEnemyLauncher.speed = 50 + 200*Math.random();
	        	this.CurEnemyLauncher.angleH= 2*Math.PI*Math.random();
	        	this.CurEnemyLauncher.angleV= Math.PI/6 + Math.PI/6*Math.random();

	        	this.CurEnemyLauncher.shoot();

	        }


    		this.world.renderer.render(this.world.scene, this.world.camera);
    	}
    }

    class Locator{
    	constructor(scene, position) {
			this.position=position;
    		this.d=Math.PI/180;
			this.angleH=Math.PI/4;
			this.angleV=Math.PI/4;		
			this.speed = 50;
			this.model=null;
			this.tRotate=0.05;
			//this.load_model=false;
			//var RR=this.model;
			this.loadModel(scene, this.position);
		}

		loadModel(scene, position){
			//Load Model
			//--------------------------------------------------
						//Load Model
			let ModelPath = 'Model/Radar/Radar PGZ-95 MCP/';
			let TexturePath = ModelPath + 'Textures/';
			
			let MTLFile=ModelPath + 'Radar.mtl';
			let OBJFile=ModelPath + 'Radar.obj';
		
			let JPGFile1=TexturePath + 'body.png';
			let JPGFile2=TexturePath + 'body_bp.png';
			let JPGFile3=TexturePath + 'body_sp.png';

			let JPGFile4=TexturePath + 'track.png';
			let JPGFile5=TexturePath + 'track_bp.png';
			let JPGFile6=TexturePath + 'track_sp.png';

			//let JPGFile2=TexturePath + 'pac_3_launcher_d.png';

			const onProgress = function ( xhr ) {
				if ( xhr.lengthComputable ) {
					const percentComplete = xhr.loaded / xhr.total * 100;
					console.log( percentComplete.toFixed( 2 ) + '% downloaded' );
					/*if (percentComplete==100){
						this.model=R;
						console.log('this.model=' + this.model);
					}*/
				}
			};

			new MTLLoader().load(
				MTLFile, 
				(materials) => {
					materials.preload();
					new OBJLoader().setMaterials(materials).load(
						OBJFile, 
						(object) => {
							var texture = [ new THREE.TextureLoader().load(JPGFile1),
											new THREE.TextureLoader().load(JPGFile2),
											new THREE.TextureLoader().load(JPGFile3),
											new THREE.TextureLoader().load(JPGFile4), 
											new THREE.TextureLoader().load(JPGFile5),
											new THREE.TextureLoader().load(JPGFile6)
							              ];

							//object.children[0].material.map = texture[0];
							//object.children[1].material.map = texture[1];
							//object.children[2].material.map = texture[2];
							//object.children[3].material.map = texture[3];
							//object.children[4].material.map = texture[3];

							object.traverse(
								function (child) {
									//зміна центра обертання
									const bbox = new THREE.Box3().setFromObject(child);
          							const vec = new THREE.Vector3();
          							bbox.getCenter(vec);

									if (child instanceof THREE.Mesh){
										//console.log('Radar: ' + child);

										child.position.set(vec.x, vec.y, vec.z);
							            if (child.geometry) {
							              child.geometry.translate(-vec.x, -vec.y, -vec.z);
							            }
									}
									/*else {
							            child.position.set(vec.x, vec.y, vec.z);
							            child.traverse((child) => {
							              if (child instanceof Mesh) {
							                child.geometry.translate(-vec.x, -vec.y, -vec.z);
							              }
							            });
							            child.position.set(0, 0, 0);
							        }*/
								}
							);

							object.scale.set(1,1,1);
							object.position.copy(position);
							object.rotation.y=Math.PI/6;
							scene.add(object);

							this.model=object;
							//console.log('R=' + R);
						}, 
						onProgress
					);
					//console.log('M2=' + M);
				}
			);

		}	

		changeAngle(pA){ 
			let k=this.d;
			switch(pA){
				case 'H-' : this.angleH-=k; break;
				case 'H+' : this.angleH+=k; break;
			}	 
		}

		animate(){
			if (this.model!==null){
				this.model.children[2].rotateY(this.tRotate);
			}
		}	
    }

    class Patriot{
		constructor(scene, position) {
			this.scene=scene;
			this.position=position;
    		this.d=Math.PI/180;
			this.angleH=Math.PI/4;
			this.angleV=Math.PI/6;		
			this.speed = 50;
			this.count_rockets=4;
			this.max_speed=300;
			this.model=null;

			//Створення стрілки з напрямом (нормалі)
			this.dir = new THREE.Vector3( 
							Math.cos(this.angleH), 
							Math.sin(this.angleV), 
							Math.sin(this.angleH) );
			
			//this.dir.normalize();
			const origin = new THREE.Vector3( this.position.x-6.5, 6.5, this.position.z-6.5); 
			const length = 15;     //довжина
			const hex = 0xffff00;  //колір
			this.arrow = new THREE.ArrowHelper( this.dir, origin, length, hex );
			scene.add( this.arrow );

			this.showParam(Spans);

			this.loadModel(scene, this.position);
		}

		loadModel(scene, position){
			//Load Model
			//--------------------------------------------------
			let Path = 'Model/PAC3_Defence/';
			let ModelPath = Path + 'File Formats/OBJ/';
			let TexturePath = Path + 'Texture/';
			
			let MTLFile=ModelPath + 'PAC3.mtl';
			let OBJFile=ModelPath + 'PAC3.obj';
		
			let JPGFile1=TexturePath + 'pac_3_tractor_d.png';
			//let JPGFile1_2=TexturePath + 'pac_3_tractor_n.png';
			//let JPGFile1_3=TexturePath + 'pac_3_tractor_s.png';
			let JPGFile2=TexturePath + 'pac_3_launcher_d.png';
			
			//--------------------------------------------------
			const onProgress = function ( xhr ) {
				if ( xhr.lengthComputable ) {
					const percentComplete = xhr.loaded / xhr.total * 100;
					console.log( percentComplete.toFixed( 2 ) + '% downloaded' );
				}
			};
			
			new MTLLoader().load(
				MTLFile, 
				(materials) => {
					materials.preload();
					new OBJLoader().setMaterials(materials).load(
						OBJFile, 
						(object) => {
							const texture = [ 
												new THREE.TextureLoader().load(JPGFile1),
												new THREE.TextureLoader().load(JPGFile2)
							              	];

							object.children[0].material.map = texture[0];
							object.children[1].material.map = texture[1];
							object.children[2].material.map = texture[0];
							
							//console.log('Launcher0: ' + object.children[0]);

							object.traverse(
								function (child) {
									const bbox = new THREE.Box3().setFromObject(child);
          							const vec = new THREE.Vector3();
          							bbox.getCenter(vec);

									if (child instanceof THREE.Mesh){
										//console.log('Radar: ' + child);

										child.position.set(vec.x, vec.y, vec.z);
							            if (child.geometry) {
							              child.geometry.translate(-vec.x, -vec.y, -vec.z);
							            }
									}

									//object.children[2].position.set(-vec.x+0.0, 4, -vec.z);
									object.children[2].geometry.translate(0, 0, 0);
									//object.children[2].geometry.origin.set(0,1,0);
								}
							);

							//console.log('i=' + i);
							object.scale.set(1,1,1);
							object.position.copy(position);
							object.rotation.y=-Math.PI/4;
							scene.add(object);
							this.model=object;
						}, 
						onProgress
					);
				}
			);
			//--------------------------------------------------
		}

		changeAngle(pA){ 
			let k=this.d;
			switch(pA){
				case 'H-' : this.angleH-=k;
				            break;

				case 'H+' : this.angleH+=k; break;

				case 'V-' : this.angleV-=k; break;
				case 'V+' : this.angleV+=k; break;
			}

			let V = new THREE.Vector3( 
				Math.cos(this.angleH), 
				Math.sin(this.angleV), 
				Math.sin(this.angleH) );

			this.arrow.setDirection( V );
			
			if(this.model!==null){
				let M=this.model;
				//console.log(M);
				M.children[2].rotation.y= Math.PI/4 -  this.angleH;
				M.children[2].rotation.z= -Math.PI/6 +  this.angleV;
				//M.children[2].setDirection( V );
			}	 

			this.showParam(Spans);	 
		}

		changeSpeed(val){
			this.speed+=val;

			if(this.speed>this.max_speed) this.speed=this.max_speed;					  	
			if(this.speed<10) this.speed=10;
		}

		shoot(){ 
			const position = this.arrow.position.clone();
			console.log(position);
			position.y=6.5;
	        //const direction = this.dir.clone().normalize();

			let rocket = new Bullet( this.scene,
									 position, 
				                     this.speed, 
				                     this.angleH, 
				                     this.angleV );
			game.Rockets.push( rocket );
		}

		showParam(view){
			let pos=this.position;

			view[0].innerHTML = (this.angleV*180/Math.PI).toFixed(1);
			view[1].innerHTML = (this.angleH*180/Math.PI).toFixed(1);
			view[2].innerHTML = '0';
			view[3].innerHTML = '0';
			view[4].innerHTML = (pos.x).toFixed(1);
			view[5].innerHTML = (pos.y).toFixed(1);
			view[6].innerHTML = (pos.z).toFixed(1);

			//console.log('x=' + pos.x + ', y=' + pos.y + ', z=' + pos.z);
		}

		animate(){

		}
    }

	class Bullet{
    	constructor(scene, position, speed, aH, aV){
 			this.startPosition = Object.assign({}, position);
			this.position      = Object.assign({}, position);   	
			this.speed=speed;
			this.angleH = aH;
			this.angleV = aV;
			this.t=0;

			this.Vx = speed * Math.cos(aH)*Math.cos(aV);
			this.Vy = speed * Math.sin(aV);
			this.Vz = speed * Math.sin(aH)*Math.cos(aV);
			this.Hmax = 0;

    		//Створення сфери (частини сфери)
			//const G = new THREE.SphereGeometry(0.5, 5, 5);
			const G = new THREE.CylinderGeometry( 0.4, 0.3, 5, 36 );
			const M = new THREE.MeshBasicMaterial({color:'grey'});
			this.mesh = new THREE.Mesh(G, M);
			this.mesh.position.copy(position);

			this.mesh.rotation.set(-Math.PI/2, -aV, aH);

			/*let V = new THREE.Vector3( 
				2*Math.cos(this.aH), 
				2*Math.sin(this.aV), 
				2*Math.sin(this.aH) );*/

			scene.add(this.mesh);

			
			//this.mesh.lookAt( V );
    	}

		move(){
			const pos = this.startPosition; 	

			this.t+=deltaT;	
			this.position.x = pos.x + this.Vx * this.t;
			this.position.z = pos.z + this.Vz * this.t;
			this.position.y = pos.y + this.Vy * this.t - game.world.g*this.t**2/2;
			//console.log(this.position.y);

			if (this.Hmax<this.position.y) this.Hmax=this.position.y;
				
			/*this.position.x+=this.Vx;
			this.position.z+=this.Vz;
